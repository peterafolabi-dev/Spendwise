databases:
  - name: spendwise-db
    databaseName: spendwise
    user: spendwise

services:
  - type: web
    name: spendwise
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn spendwise.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spendwise-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
