services:
  - type: web
    name: spendwise
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn spendwise.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: spendwise-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: NODE_VERSION
        value: 20.x

  - type: psql
    name: spendwise-db
    plan: free
