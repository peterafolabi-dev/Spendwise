{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="bg-white dark:bg-slate-800 shadow rounded-lg p-6 border border-rose-500/20">
        <h2 class="text-2xl font-bold leading-7 text-rose-600 dark:text-rose-400 sm:text-3xl mb-4">
            Confirm Deletion
        </h2>
        <p class="text-gray-700 dark:text-gray-300 mb-6">
            Are you sure you want to delete this item? This action cannot be undone.
        </p>
        
        <form method="post">
            {% csrf_token %}
            <div class="flex justify-end space-x-3">
                <a href="javascript:history.back()" class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 shadow-sm text-sm font-medium rounded-md text-gray-700 dark:text-gray-300 bg-white dark:bg-slate-700 hover:bg-gray-50 dark:hover:bg-slate-600">
                    Cancel
                </a>
                <button type="submit" class="inline-flex items-center justify-center rounded-md border border-transparent bg-rose-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-rose-700">
                    Yes, Delete
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
