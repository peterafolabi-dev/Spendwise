{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="mb-8">
        <h2 class="text-2xl font-bold leading-7 text-gray-900 dark:text-white sm:text-3xl sm:truncate">Profile</h2>
    </div>
    
    <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-6">
        <div class="flex items-center space-x-4 mb-6">
            <div class="h-16 w-16 rounded-full bg-primary-500 flex items-center justify-center text-white text-2xl font-semibold">
                {{ user.username|make_list|first|upper|default:"U" }}
            </div>
            <div>
                <h3 class="text-xl font-medium text-gray-900 dark:text-white">{{ user.username|default:"User" }}</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400">{{ user.email|default:"user@example.com" }}</p>
            </div>
        </div>
        <div class="border-t border-gray-200 dark:border-gray-700 pt-6">
            <button class="inline-flex items-center justify-center rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 shadow-sm hover:bg-gray-50 dark:hover:bg-gray-600">
                Edit Profile
            </button>
        </div>
    </div>
</div>
{% endblock %}
