{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="sm:flex sm:items-center sm:justify-between mb-8">
        <div>
            <h2 class="text-2xl font-bold leading-7 text-gray-900 dark:text-white sm:text-3xl sm:truncate">Accounts</h2>
        </div>
        <div class="mt-4 sm:mt-0">
            <button type="button" class="inline-flex items-center justify-center rounded-md border border-transparent bg-primary-600 px-4 py-2 text-sm font-medium text-white shadow-sm hover:bg-primary-700">
                Add Account
            </button>
        </div>
    </div>
    
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <!-- Account Card -->
        <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-medium text-gray-900 dark:text-white">Checking</h3>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Bank</span>
            </div>
            <p class="text-3xl font-semibold text-gray-900 dark:text-white mb-2">$5,240.00</p>
            <p class="text-sm text-gray-500 dark:text-gray-400">Chase Bank ****1234</p>
        </div>
    </div>
</div>
{% endblock %}
