{% extends 'base.html' %}

{% block title %}Password Updated — SpendWise{% endblock %}

{% block content %}
<main class="mx-auto flex min-h-[calc(100vh-4rem)] w-full max-w-xl items-center px-4 py-12">
    <section class="w-full rounded-3xl border border-slate-200 bg-white p-8 shadow-xl dark:border-slate-800 dark:bg-slate-900">
        <p class="mb-2 text-sm font-semibold uppercase tracking-wide text-emerald-600 dark:text-emerald-400">All set</p>
        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Your password has been set.</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600 dark:text-slate-400">You can now sign in with your new password.</p>
        <a href="{% url 'login' %}" class="mt-6 inline-block rounded-xl bg-emerald-600 px-5 py-3 font-semibold text-white transition hover:bg-emerald-500">Sign in</a>
    </section>
</main>
{% endblock %}
