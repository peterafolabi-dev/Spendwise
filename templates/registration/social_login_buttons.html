<div class="my-5 space-y-3" aria-label="Social sign in">
    <div class="flex items-center gap-3 text-xs text-slate-400">
        <span class="h-px flex-1 bg-slate-200 dark:bg-slate-700"></span>
        <span>OR CONTINUE WITH</span>
        <span class="h-px flex-1 bg-slate-200 dark:bg-slate-700"></span>
    </div>
    <div class="grid grid-cols-1 gap-3">
        {% if google_login_enabled %}
        <form method="post" action="{% url 'google_login' %}">
            {% csrf_token %}
            <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700" aria-label="Continue with Google">
                <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" data-brand="google" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.15v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.15a11 11 0 0 0 0 9.88l3.69-2.84z"/><path fill="#EA4335" d="M12 4.36c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45.99 14.97 0 12 0A11 11 0 0 0 2.15 7.06L5.84 9.9C6.71 7.3 9.14 5.36 12 5.36z"/></svg>
                Google
            </button>
        </form>
        {% else %}
        <button type="button" disabled aria-disabled="true" title="Set Google OAuth credentials in your deployment environment to enable sign-in" class="flex w-full cursor-not-allowed items-center justify-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm font-semibold text-slate-400 dark:border-slate-700 dark:bg-slate-800/50 dark:text-slate-500" aria-label="Google sign-in not configured">
            <svg class="h-5 w-5 shrink-0 opacity-50" viewBox="0 0 24 24" data-brand="google" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.15v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.15a11 11 0 0 0 0 9.88l3.69-2.84z"/><path fill="#EA4335" d="M12 4.36c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45.99 14.97 0 12 0A11 11 0 0 0 2.15 7.06L5.84 9.9C6.71 7.3 9.14 5.36 12 5.36z"/></svg>
            Google
        </button>
        {% endif %}
    </div>
    {% if not google_login_enabled %}
    <p class="text-center text-xs text-slate-400">Social sign-in buttons activate after their provider credentials are added to your deployment environment.</p>
    {% endif %}
</div>
